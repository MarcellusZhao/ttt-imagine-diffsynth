# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT B — wide anchor (k=3) at 480p, 40 new frames per chunk.
#
# Pairs with model_inference/configs/Wan2.2-TI2V-5B-e2e-ttt-k3-480p-vbench.yaml, which
# samples at the SAME frames_per_chunk: 53. Train and test therefore match in both
# resolution and chunk length, so this arm carries no train/test geometry gap at all —
# unlike the k3-720p arm, which trains 720x1280 @ fpc=53 and samples 480x832 @ fpc=49, and
# so moves both variables at once.
#
# Frame budget at fpc=53, k=3 + sink:
#   53 frames = 14 latents; 4 pinned (sink at latent 0, anchor block at latents 1..3);
#   10 supervised. Chunk overlap = anchor_overlap_pixel_frames(3, sink) = 13, so the
#   training stride is 40 and inference emits 40 NEW frames per chunk (13 pinned pixel
#   frames trimmed at each boundary). Pinned overhead is 13/53 = 25%.
#   Against the k=1 baseline at fpc=41 (11 latents, 2 pinned, 9 supervised, 36 new
#   frames/chunk) this is strictly MORE supervised signal per chunk, not less — so the
#   k=3 anchor is not being bought with a weaker meta objective.
#
# Why 53 and not 41/49/93 — memorize->predict pairs per clip, computed on the dataset
# below (ultravideo_long_filtered_all_16k_len.csv, 15728 clips, median 250 / mean 300
# frames) with _encode_chunks' own arithmetic at k=3 + sink:
#       fpc   latents  supervised  stride   mean pairs   median   % usable
#        41     11          7        28        8.8          7       100%
#        49     13          9        36        6.5          5       100%
#        53     14         10        40        5.7          4       100%   <- this config
#        93     24         20        80        2.1          1        90%
#   fpc=93 is what a "80 new frames per chunk" target would require, and it is the one
#   to avoid: stride 80 means a clip needs >= 173 frames for even ONE pair, 10% of clips
#   get silently skipped (n < 2 in _encode_chunks), and pair density collapses to 2.1 —
#   phi_0 would barely see adaptation, while inference runs 23 sequential adaptations per
#   clip (num_chunks: 24). fpc=53 keeps every clip usable and still averages 5.7 pairs.
#
# What must NOT differ between this file and the inference config is k:
# e2e_num_anchor_latent_frames here and num_anchor_latent_frames there, since k sets both
# how many leading latents are pinned and how many decoded frames each chunk hands
# forward. Same for e2e_condition_on_sink_frame vs condition_on_sink_frame, and for the
# inner loop (e2e_inner_optimizer / e2e_inner_lr / e2e_num_gradient_steps -> the
# inference config's `inner_loop` block) — the test-time update honours those fields, so
# phi_0 is only ever optimal for the procedure it was meta-learned under.
#
# Cost: tokens per forward are (480/32)*(832/32)*14 = 5460, against 22*40*11 = 9680 for
# the 704x1280 fpc=41 k=1 baseline, i.e. ~56% — and attention is quadratic in that, so
# the forward is cheaper still. That is where the budget for the deeper unroll (mean 5.7
# pairs, each with e2e_num_gradient_steps inner steps) comes from. 14 latents also sits
# inside the base model's native 121-frame / 31-latent extent, so no RoPE extrapolation.
#
# Run with:
#   accelerate launch examples/wanvideo/model_training/train_e2e_ttt.py \
#       --config examples/wanvideo/model_training/configs/Wan2.2-TI2V-5B-e2e-ttt-fomaml-k3-480p.yaml
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  # 960x540 source, not the 1920x1080 one: the output here is 832x480, so downscaling from
  # 1080p buys almost nothing while costing 12.6s per clip to decode against 4.4s (measured
  # -- decode tracks the SOURCE resolution, not the output size). Use ultravideo_long_1920
  # for any config whose height/width exceed 540p, or the frames get upscaled.
  dataset_base_path: /work/nlp/hzhao/datasets/e2e-ttt-video/ultravideo_long_960/curated_videos
  # *_len.csv is the same 3000 rows plus a `num_frames` column, generated by
  # datasets/ultravideo_long/add_length_column.py. The extra column is inert to
  # UnifiedDataset (operators run only on data_file_keys) and exists purely to feed
  # length_grouped_batching below.
  dataset_metadata_path: /home/hzhao/ttt-imagine-diffsynth/datasets/ultravideo_long/ultravideo_long_filtered_all_16k_len.csv
  dataset_repeat: 1
  # Decode upcoming clips in background workers instead of on the training loop's critical
  # path, where the default of 0 workers pays for it serially every step. Measured cost of
  # loading one full-length clip to 480x832 (ffmpeg demux + decode + resize): 4.4s from the
  # 960x540 source, 12.6s from the 1920x1080 one -- decode is dominated by the SOURCE
  # resolution, not the output size, so this number tracks dataset_base_path above, not
  # height/width below. 2 workers drop the measured per-step stall to ~1s (the residue is IPC
  # of the decoded PIL frames and cannot be hidden); 4 buy only ~0.5s more but double the
  # in-flight RAM. Cost = workers x prefetch_factor(2) x clip size (~1.2MB/frame at 480p ->
  # ~1.2GB/rank typical, ~4.6GB for the longest 960-frame clips).
  dataset_num_workers: 2
  # Resample every clip's time axis to frame_rate below, instead of reading its native
  # frame sequence verbatim. The clips ARE already 16fps (resampled offline -- see `rsfps16`
  # in output_path), so this is verified byte-identical on today's data: same frames, and at
  # most 4 fewer at the tail on some clips. It is on anyway because that uniformity is
  # otherwise an UNENFORCED precondition living only in a preprocessing step -- and E2E-TTT
  # is unusually sensitive to it, since the k>1 anchor block conveys velocity and therefore
  # assumes a constant inter-frame interval. It is also strictly cheaper: the frame count
  # then comes from the container's `duration` rather than a full ffmpeg demux pass
  # (count_frames() drops from 1 call per clip to 0).
  fix_frame_rate: true
  # Must equal the clips' on-disk fps. Resampling DOWN just drops frames; resampling UP
  # duplicates them, zeroing the motion across those pairs -- LoadVideo warns per clip.
  frame_rate: 16
  # Group each optimizer step's clips by length instead of shuffling globally, so ranks stop
  # idling at the all-reduce behind the step's longest clip.
  #
  # EXPECT ~2-3% HERE, NOT the figure the startup line prints. Anchor measurement is the 4x
  # H100 k3-720p baseline run (750 steps, 11.06h, 53.1 s/step, same short_3k data and same
  # fpc=49/k=3+sink chunking): regressing step time on the expected 4-rank max chunk count
  # gives  step ~= 1.42 s/chunk * max_chunks + 43.6 s  -- 82% of a step is FIXED cost that no
  # reordering touches. Grouping moves mean max_chunks 6.68 -> 5.34, worth 1.9s there (1.037x).
  # Extrapolating to this arm: token count per forward is (480/32)*(832/32)*14 = 5460 (14
  # latents at fpc=53, not the 720p run's 13 at fpc=49) vs that run's 22*40*13 = 11440, i.e.
  # 48%, so the chunk-dependent slope drops to ~0.68 s/chunk while the fixed cost does NOT
  # (it is dominated by resolution-independent work), leaving ~0.9s per step => ~1.03x.
  # Cheaper forwards make the imbalance term a SMALLER share, so 480p gains less than 720p.
  # The `imbalance_report` line printed at startup models cost as purely proportional to chunk
  # count (zero fixed cost) and reports ~1.25x at 4 GPUs -- read it as a bound on the
  # imbalance, not a wall-clock prediction.
  # Kept on regardless: pure reordering, costs nothing, and the gain grows with any future
  # reduction of the fixed cost. short_3k is also a length-FILTERED subset (160-320 frames,
  # chunk 4..8); ultravideo_long_filtered_all_16k_len.csv spans chunk 3..23, so the imbalance
  # term is far larger there -- do not read a benchmark taken here as this feature's general
  # value.
  #
  # Order only; the loss, the clips and the measured frame counts are untouched. Verified
  # against real loads: `num_frames` snapped to 4n+1 matched the actually-decoded count on 9 of
  # 10 sampled clips (worst case 4 frames off), and it is a ranking hint regardless.
  length_grouped_batching: true
  length_column: num_frames
  # Sort window = group_size * mult, where group_size = num_processes * gradient_accumulation_
  # steps (200 clips at 4 GPUs). Bounded so the epoch keeps sampling randomness; the resulting
  # groups are then shuffled globally so clip length never correlates with training time (LR
  # warmup/cosine, ErrorRecycler warmup). NOTE the knob runs opposite to its --help string: 1
  # degenerates to a plain random shuffle, and only mult >= len(dataset)/group_size approaches
  # a global sort.
  length_group_megabatch_mult: 50
  # 480p — matched to the inference resolution, which removes the train/test
  # resolution gap the 720p-train/480p-infer baseline carries. Only the chunk-length
  # gap (13 -> 24 latents) remains, and both sit inside the base model's native
  # 121-frame / 31-latent extent, so no RoPE extrapolation is involved.
  height: 480
  width: 832
  num_frames: 0

model:
  model_paths:
    - - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/google/umt5-xxl

train:
  learning_rate: 1.0e-5
  lr_scheduler: cosine_warmup
  lr_warmup_steps: 30
  lr_min_ratio: 0.1
  num_epochs: 1
  output_path: /work/nlp/hzhao/checkpoints/e2e-ttt/Wan2.2-TI2V-5B_e2e_ttt_fomaml_k3_480p_fpc53_antidrift_buf500_rsfps16_len_grouped_16k
  remove_prefix_in_ckpt: pipe.dit.
  use_gradient_checkpointing: true

lora:
  lora_base_model: dit
  lora_target_modules: [q, k, v, o, ffn.0, ffn.2]
  # Must match `lora_rank` in the inference config used to sample this phi_0.
  lora_rank: 128

logger:
  enable_wandb_log: true
  wandb_project: E2E-TTT

e2e_ttt:
  # 0 = adaptive: as many chunks as each clip affords. On this dataset at fpc=53/stride 40
  # that is mean 6.7 chunks (median 5, range 3..23), i.e. mean 5.7 memorize->predict pairs.
  # At 480p the per-forward cost is ~56% of the 720p k=1 baseline, so the deeper unroll
  # fits; set a positive cap if the longest clips OOM (the graph grows with chunk count).
  # Note the cap interacts with length_grouped_batching below: capping flattens the tail
  # that grouping exists to balance.
  e2e_num_chunks: 0
  # Training chunk, matched to the inference config's frames_per_chunk (no train/test chunk
  # gap in this arm). 53 = 4n+1 -> 14 latents; with k=3 + sink, 4 are pinned and 10 are
  # supervised; overlap 13, stride 40. See the header for why not 41/49/93.
  e2e_frames_per_chunk: 53
  # k. Must equal num_anchor_latent_frames in the inference config (3 there).
  e2e_num_anchor_latent_frames: 3
  e2e_condition_on_last_frame: true
  e2e_condition_on_sink_frame: true
  e2e_num_gradient_steps: 2
  e2e_num_mc_samples: 1
  e2e_inner_lr: 1.0e-5
  e2e_max_inner_grad_norm: 1.0
  e2e_inner_optimizer: adamw
  e2e_truncate_steps: []
  e2e_sigma_shift: 5.0
  e2e_first_order: true
  e2e_use_error_recycling: true
  e2e_num_grids: 50
  # ── ONE arena per NODE, not per rank. THIS LINE IS WHAT MAKES k=500 BELOW POSSIBLE;
  # the two must be changed together. Buffers are HOST RAM (`.cpu()` in the harvest
  # path), and host RAM -- not GPU -- is what OOM-killed the 720p runs.
  #
  # VERIFIED on kh009 (2026-08-16): slurm sets TMPDIR=/tmp/<jobid>, and /tmp there is
  # /dev/nvme0n1p5 -- xfs on node-local NVMe, 5.8 TB with 5.7 TB free. Real local disk,
  # per job; on a multi-node run each node gets its own physical directory behind the
  # same path string, which is exactly the per-node arena we want. `${VAR}` and `~` are
  # expanded; an UNSET variable raises at startup rather than creating a literal
  # "${TMPDIR}" dir on shared storage. See the 720p config for why not /dev/shm.
  #
  # If the directory is unusable the code warns and falls back to per-rank buffers --
  # which at k=500 is ~314 GB/rank and dies. The warning prints that number in the
  # first seconds of the log; do not ignore it.
  e2e_shared_buffer_dir: ${TMPDIR}/e2e_ttt_errbuf
  # 500 = SVI's own buffer size, affordable only because the arena is shared. The
  # affordable k is resolution-dependent: at 480x832 / fpc=53 the chunk latent is
  # 48 x 14 x 30 x 52 x 2B = 2.10 MB and the k=3 anchor slice 0.45 MB, so one unit of
  # k costs 50 grids x 2.55 MB = 0.127 GB -- 2.3x cheaper than the 720p arm's 0.287 GB:
  #
  #        k     shared/node     per-rank x4
  #       96        12.2 GB         48.9 GB     <- previous setting
  #      500        63.6 GB        254.6 GB     <- this config
  #
  # Against --mem=368G minus ~100 GB non-buffer (lower than the 720p arm's ~115 GB:
  # the dataloader carries ~1.2 MB/frame here, not ~2.8) that is 24% of the headroom,
  # and k_max is ~2100 -- memory is nowhere near binding at this resolution. Both k=3
  # arms now run the same k=500, so the buffer is no longer a variable between them.
  #
  # NOTE what this does and does not buy: `err_buffer/miss_rate` was already 0 at k=96,
  # so everything past saturation buys DIVERSITY, not coverage. Also the write rate per
  # rank is unchanged -- each of 4 ranks owns 125 of the 500 slots per grid -- so the
  # pool takes proportionally longer to fill than k=96 did; watch
  # `err_buffer/total_samples` plateau before reading anything into an ablation.
  e2e_error_buffer_k: 500
  e2e_buffer_warmup_iter: 20
  e2e_noise_prob: 0.01 # [0.01, 0.9]
  e2e_latent_prob: 0.9
  e2e_y_prob: 0.9
  e2e_clean_prob: 0.5 # [0.5, 0.9]
