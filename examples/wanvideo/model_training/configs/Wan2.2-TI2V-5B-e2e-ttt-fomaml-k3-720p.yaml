# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT A — wide anchor (k=3) at 720p, frames_per_chunk 53.
#
# E2E-TTT meta-training for Wan2.2-TI2V-5B. The controlled arm: the anchor width is
# the variable under test, and the chunk length is raised from the k=1 baseline's 41
# to pay for it. The point is a clean test of ONE hypothesis: that reversed motion at
# chunk boundaries comes from the conditioning carrying no velocity, not from weak
# memorization.
#
# Why k>1 should matter: a single anchor latent is motion-unidentifiable — no
# velocity can be read off one frame — so at k=1 the ONLY channel carrying motion
# direction into the next chunk is the LoRA scratchpad, whose memorize objective is
# unconditioned flow matching and therefore dominated by appearance rather than
# direction. k=3 pins the previous chunk's last 12 pixel frames, putting velocity
# (and acceleration) directly in the conditioning.
#
# WHY 53 AND NOT 41. Pinned frames are given context, not supervised content, so a
# k=3+sink block costs supervision, and it widens the chunk overlap from the k=1
# legacy path's 1 frame to 4k+1 = 13 — which costs stride. 53 buys back both:
#
#            latents  pinned  supervised  overlap  stride  new frames/chunk
#   k=1 @41    11       2         9          1       40          36      <- baseline
#   k=3 @41    11       4         7         13       28          28
#   k=3 @49    13       4         9         13       36          36
#   k=3 @53    14       4        10         13       40          40      <- this config
#
# At 53 the arm carries MORE supervised latents than the baseline (10 vs 9) and
# restores its training stride exactly (40), so clips chunk at the same cadence and
# unroll depth is not what changed. Note "stride" (training chunk overlap) and "new
# frames/chunk" (decoded yield after drop_boundary_frame) coincide at k=3 but not at
# k=1, where the legacy 1-frame overlap is narrower than the 5 pixel frames the two
# pinned latents actually cover — one of the asymmetries k>1 removes.
#
# 53 is also the chunk length all three k=3 INFERENCE configs run
# (…-e2e-ttt-k3-720p-vbench.yaml, …-k3-480p-vbench.yaml, and the no-adaptation
# ablation …-chunk-by-chunk-anchored-vbench.yaml), so there is no train/test
# chunk-length gap and those arms are length-matched at 973 frames.
#
# HISTORY: this config previously ran 49, chosen to match the k=1 baseline on
# supervised latents (9) and decoded yield (36) while accepting a shorter stride (36
# vs 40). 53 trades that for stride parity and train/test chunk parity. The measured
# pair-density note that used to sit here ("4.3 pairs/clip vs the baseline's 4.0")
# was taken at 49 and does not carry over — 53 needs 12 more frames before a clip
# yields its first chunk, so short clips give one fewer.
#
# The k=1 baseline config itself (Wan2.2-TI2V-5B-e2e-ttt-fomaml.yaml) was deleted in
# 32f9aee0; the numbers above are what remains of it. Its geometry still lives in the
# k=1 inference config, Wan2.2-TI2V-5B-e2e-ttt-vbench.yaml.
#
# Cost: 14 latents instead of 11 at 720x1280 is 1.27x the baseline's sequence length
# (attention goes as the square, so ~1.6x there). Chunk overlap is 13 frames = 12
# anchored pixel frames plus one leading frame that exists only as VAE causal context
# (the sink overwrites its latent). Confirm via train/anchor_overlap_frames.
#
# Run with:
#   accelerate launch examples/wanvideo/model_training/train_e2e_ttt.py \
#       --config examples/wanvideo/model_training/configs/Wan2.2-TI2V-5B-e2e-ttt-fomaml-k3-720p.yaml
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  dataset_base_path: /work/nlp/hzhao/datasets/e2e-ttt-video/ultravideo_long_1920/curated_videos
  # *_len.csv is the same 3000 rows plus a `num_frames` column, generated by
  # datasets/ultravideo_long/add_length_column.py. The extra column is inert to
  # UnifiedDataset (operators run only on data_file_keys) and exists purely to feed
  # length_grouped_batching below.
  dataset_metadata_path: /home/hzhao/ttt-imagine-diffsynth/datasets/ultravideo_long/ultravideo_long_filtered_all_16k_len.csv
  dataset_repeat: 1
  # Decode upcoming clips in background workers instead of on the training loop's critical
  # path. Loading one full-length clip costs 5-8s (ffmpeg demux + decode + resize) and the
  # default of 0 workers pays that serially every step; 2 workers drop the measured per-step
  # stall to ~1s (the residue is IPC of the decoded PIL frames and cannot be hidden). 4
  # workers buy only ~0.5s more but double the in-flight RAM. Cost = workers x
  # prefetch_factor(2) x clip size (~2.8MB/frame at 720p -> ~2.8GB/rank typical, ~10.6GB for
  # the longest 960-frame clips); lower this if the node is RAM-tight.
  dataset_num_workers: 2
  # Resample every clip's time axis to frame_rate below, instead of reading its native
  # frame sequence verbatim. The clips ARE already 16fps (resampled offline -- see `rsfps16`
  # in output_path), so this is verified byte-identical on today's data: same frames, and at
  # most 4 fewer at the tail on some clips. It is on anyway because that uniformity is
  # otherwise an UNENFORCED precondition living only in a preprocessing step -- and E2E-TTT
  # is unusually sensitive to it, since the k>1 anchor block conveys velocity and therefore
  # assumes a constant inter-frame interval. It is also strictly cheaper: the frame count
  # then comes from the container's `duration` rather than a full ffmpeg demux pass
  # (count_frames() drops from 1 call per clip to 0).
  fix_frame_rate: true
  # Must equal the clips' on-disk fps. Resampling DOWN just drops frames; resampling UP
  # duplicates them, zeroing the motion across those pairs -- LoadVideo warns per clip.
  frame_rate: 16
  # Group each optimizer step's clips by length instead of shuffling globally, so ranks stop
  # idling at the all-reduce behind the step's longest clip.
  #
  # EXPECT ~3-4% HERE, NOT the figure the startup line prints. Measured against the 4x H100
  # baseline run (750 steps, 11.06h, 53.1 s/step): regressing step time on the expected
  # 4-rank max chunk count gives  step ~= 1.42 s/chunk * max_chunks + 43.6 s, i.e. 82% of a
  # step is FIXED cost that no amount of reordering touches. Grouping moves mean max_chunks
  # 6.68 -> 5.34, worth 1.9s => 1.037x. The `imbalance_report` line printed at startup models
  # cost as purely proportional to chunk count (zero fixed cost) and therefore reports ~1.25x
  # at 4 GPUs -- treat it as a bound on the imbalance, not a wall-clock prediction.
  # Two independent reasons the payoff is small on this arm: short_3k is a length-FILTERED
  # subset (160-320 frames, chunk 4..8), and the fixed cost dominates. On
  # ultravideo_long_filtered_all_16k_len.csv the chunk span is 3..23, so the imbalance term is
  # far larger there -- do not read a benchmark taken here as this feature's general value.
  # Kept on regardless: it is pure reordering, costs nothing, and the gain grows with any
  # future reduction of the fixed cost (of which ~14.3s is the synchronous 720p decode that
  # dataset_num_workers above now hides).
  #
  # Order only; the loss, the clips and the measured frame counts are untouched. Verified
  # against real loads: `num_frames` snapped to 4n+1 matched the actually-decoded count on 9 of
  # 10 sampled clips (worst case 4 frames off), and it is a ranking hint regardless.
  length_grouped_batching: true
  length_column: num_frames
  # Sort window = group_size * mult, where group_size = num_processes * gradient_accumulation_
  # steps (200 clips at 4 GPUs). Bounded so the epoch keeps sampling randomness; the resulting
  # groups are then shuffled globally so clip length never correlates with training time (LR
  # warmup/cosine, ErrorRecycler warmup). NOTE the knob runs opposite to its --help string: 1
  # degenerates to a plain random shuffle, and only mult >= len(dataset)/group_size approaches
  # a global sort.
  length_group_megabatch_mult: 50
  height: 720
  width: 1280
  num_frames: 0

model:
  model_paths:
    - - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/google/umt5-xxl

train:
  learning_rate: 1.0e-5
  lr_scheduler: cosine_warmup
  lr_warmup_steps: 30
  lr_min_ratio: 0.1
  num_epochs: 1
  # REQUIRED at this scale, not a nicety. With save_steps unset the runner saves only via
  # on_epoch_end, i.e. exactly once — and at num_epochs: 1 that means a single write at the
  # very end. Job 3998495 died at step 1557/1966 (79%) after 31h of 8xH100 and left ZERO
  # checkpoints behind. 100 steps is ~2h at the measured 73.6 s/step. Setting this also
  # switches the final write from `epoch-0.safetensors` to `step-<N>.safetensors`
  # (ModelLogger.on_training_end), which still fires.
  save_steps: 500
  output_path: /work/nlp/hzhao/checkpoints/e2e-ttt/Wan2.2-TI2V-5B_e2e_ttt_fomaml_k3_720p_fpc53_antidrift_buf500_rsfps16_len_grouped_16k
  remove_prefix_in_ckpt: pipe.dit.
  # NOT optional at 720p. It is honoured on BOTH the memorize and predict paths of
  # meta-training -- `compute_flow_matching_loss` sets `gc = use_gradient_checkpointing`
  # with no forcing, and `_override_checkpointed_blocks` keeps it compatible with the
  # differentiable LoRA override by threading phi_k in as explicit checkpoint inputs. So
  # the measured memory model in e2e_ttt below (alloc ~= 10.8 + 3.56 * num_chunks) is the
  # CHECKPOINTED number.
  #
  # Turning it off replaces ~2.3 GB of retained block inputs per predict graph with the
  # full intra-block activations. At 14 latents / 704x1280 the sequence is
  # 14 * (44/2) * (80/2) = 12320 tokens, and one DiTBlock retains roughly
  #   norm/q/k/v/attn-out/o (~6 x 12320 x 3072 x 2B) + ffn.0 and GELU (2 x 12320 x 14336
  #   x 2B) + residuals  ~= 1.5 GB
  # so ~45 GB across 30 blocks. FOMAML holds ONE such graph per memorize->predict pair
  # until the single outer backward, which turns the 3.56 GB/chunk slope into ~46:
  #
  #   N=2 -> ~57 GB (fits)   N=3 -> ~103 GB (OOM)   N=6 (median) -> ~287 GB
  #
  # The dataset's MINIMUM is 3 chunks, so every clip would die. Even halving the estimate
  # only moves the failure from N=3 to N=6. 480p is not a way out either: 5460 tokens is
  # 44% of 720p, so ~20 GB/graph, and the median 6-chunk clip still lands at ~111 GB.
  #
  # If the goal is wall-clock, the ~25% checkpointing overhead is not the lever to pull --
  # 82% of a step is fixed cost (see length_grouped_batching above). Cap e2e_num_chunks
  # only if you also accept losing unroll depth, which is the meta-objective itself.
  use_gradient_checkpointing: true

lora:
  lora_base_model: dit
  lora_target_modules: [q, k, v, o, ffn.0, ffn.2]
  # Must match `lora_rank` in the inference config used to sample this phi_0.
  lora_rank: 128

logger:
  enable_wandb_log: true
  wandb_project: E2E-TTT

e2e_ttt:
  # 0 = adaptive: one chunk per `frames_per_chunk` of the clip's real length, i.e. the FULL
  # video, no truncation. 720p now trains this way end to end; the cap below is history, kept
  # because the cost model it records is still the right one to reason with.
  #
  # FOMAML accumulates one live predict graph per memorize->predict pair
  # (`meta_loss = meta_loss + loss_pred` in run_meta_inner_loop) and the runner backwards
  # ONCE, so peak VRAM is still LINEAR in the chunk count of the clip. Measured on this exact
  # config (job 3997049, 8x H100 80/93GB, wandb gpu/mem_alloc_gb vs train/num_chunks -- the
  # fit is essentially exact, R^2 ~ 1):
  #
  #     alloc_GB  ~=  10.8  +  3.56 * num_chunks        (+ ~4 GB transient -> peak)
  #
  #   N=6 -> 32 GB    N=11 -> 50 GB    N=16 -> 68 GB    N=20 -> 82 GB    N=22 -> 89 GB
  #
  # That job OOM'd at N=22 (step 55, 4 of 8 ranks) and is where the old `e2e_num_chunks: 16`
  # ceiling came from. What made the cap unnecessary is the ALLOCATOR, not a smaller graph:
  # 3997049 ran without `expandable_segments`, and died holding 7.69 GiB reserved-but-
  # unallocated while asking for 338 MiB -- 8% of the card lost to fragmentation on exactly
  # the workload that provokes it (large, repeated, differently-sized allocations, all freed
  # at once at the outer backward). Every e2e-ttt launcher now exports
  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True, which reclaims most of that, so the
  # numbers above are read as allocated ~= reserved rather than allocated + 8%.
  #
  # Know where the ceiling is before raising fpc or resolution: this config reads
  # ultravideo_long_filtered_all_16k_len.csv (160..960 frames = 3..23 chunks at stride 40),
  # so the longest clips land at ~93 GB allocated -- comfortable in practice but not roomy,
  # and 1.7% of clips exceed 20 chunks, enough that a multi-hour run always eventually draws
  # one. If a long clip does OOM, re-capping here is the first knob: set it to 16 for ~20 GB
  # of headroom at the cost of truncating the 4.2% of clips with >16 chunks. NOTE the
  # truncation keeps the clip's FIRST n chunks (see _encode_chunks), so a cap makes long
  # clips train only on their opening -- a coverage bias, not a correctness bug, and the
  # reason adaptive is preferred now that it fits.
  e2e_num_chunks: 0
  # 53 = 4n+1 -> 14 latents; with 4 pinned (sink at latent 0, anchor block at 1..3)
  # that leaves 10 supervised, and 53 - 13 overlap = 40 new decoded frames per chunk.
  # Matches the chunk length all three k=3 inference configs use. See the header.
  e2e_frames_per_chunk: 53
  # THE experimental variable. 3 anchor latents = the previous chunk's last 12 pixel
  # frames, pinned at latent positions 1..3 (position 0 goes to the sink).
  e2e_num_anchor_latent_frames: 3
  e2e_condition_on_last_frame: true
  # Kept ON. The sink lies about temporal distance (RoPE reads it as adjacent to the
  # anchor block), which at k=1 was the model's only velocity cue and so produced a
  # bogus one. At k=3 the block supplies 12 frames of unambiguous real motion, so the
  # sink degrades to what it is actually wanted for — a global appearance reference.
  e2e_condition_on_sink_frame: true
  e2e_num_gradient_steps: 2
  e2e_num_mc_samples: 1
  e2e_inner_lr: 1.0e-5
  e2e_max_inner_grad_norm: 1.0
  e2e_inner_optimizer: adamw
  e2e_truncate_steps: []
  e2e_sigma_shift: 5.0
  e2e_first_order: true
  # Error recycling. The anchor y-error is now harvested and injected as one coherent
  # 3-frame block (the predict chunk's last 3 latents = its last 12 pixel frames,
  # exactly the window inference hands forward). Independent per-frame draws would
  # inject temporally incoherent noise into the very velocity cue k=3 exists to
  # provide, so the block path is not optional — see ErrorRecycler.harvest.
  e2e_use_error_recycling: true
  e2e_num_grids: 50
  # ── ONE arena per NODE, not per rank. THIS LINE IS WHAT MAKES k=500 BELOW POSSIBLE;
  # the two must be changed together. Buffers are HOST RAM (`.cpu()` in the harvest
  # path) and host RAM is the binding constraint on this arm -- not GPU.
  #
  # VERIFIED on kh009 (2026-08-16): slurm sets TMPDIR=/tmp/<jobid>, and /tmp there is
  # /dev/nvme0n1p5 -- xfs on node-local NVMe, 5.8 TB with 5.7 TB free. So this is real
  # local disk, per job, and 143.6 GB is 2.5% of it. On a multi-node run each node gets
  # its own physical directory behind the same path string, which is exactly the
  # per-node arena we want. `${VAR}` and `~` are expanded; an UNSET variable raises at
  # startup rather than creating a literal "${TMPDIR}" dir on shared storage.
  #
  # Do NOT "simplify" this to /dev/shm. That also works (189 GB tmpfs, verified) but
  # tmpfs pages are unreclaimable with ~1 GiB of swap on a 377 GiB node, whereas these
  # are ordinary page cache the kernel can evict under pressure. And since
  # JobContainerType is null there is no private /tmp namespace, so nothing is auto-
  # purged: a segment leaked by an OOM-kill (SIGKILL -- no cleanup handler runs) would
  # cost the NEXT job pinned RAM under tmpfs, versus identifiable files under
  # /tmp/<jobid> here.
  #
  # If the directory is unusable the code warns and falls back to per-rank buffers --
  # which at k=500 is ~709 GB/rank and dies. The warning prints that number in the
  # first seconds of the log; do not ignore it.
  e2e_shared_buffer_dir: ${TMPDIR}/e2e_ttt_errbuf
  # 500 = SVI's own buffer size, affordable only because the arena is shared.
  # At 704x1280 / fpc=53 the chunk latent is 48 x 14 x 44 x 80 x 2B = 4.73 MB and the
  # k=3 anchor slice 1.01 MB, so one unit of k costs 50 grids x 5.74 MB = 0.287 GB:
  #
  #        k     shared/node     per-rank x4
  #       50        14.4 GB         57.4 GB     <- previous setting
  #       96        27.6 GB        110.3 GB
  #      500       143.6 GB        574.5 GB     <- this config (per-rank: impossible)
  #
  # Budget: --mem=368G minus ~115 GB measured non-buffer (model CPU copies, umt5, VAE,
  # optimizer state, and the dataloader's in-flight frames at ~2.8 MB/frame) leaves
  # ~253 GB, so 143.6 GB uses 57% of the headroom. k_max is 880 against that raw figure,
  # ~750 if you also keep a 10% safety margin. Recompute with max_shared_k() in
  # e2e_ttt.py if fpc, resolution or num_grids changes -- all three move the per-slot cost.
  #
  # NOTE what this does and does not buy: `err_buffer/miss_rate` was already 0 at k=96,
  # so everything past saturation buys DIVERSITY, not coverage. Also the write rate per
  # rank is unchanged -- each of 4 ranks owns 125 of the 500 slots per grid -- so the
  # pool takes proportionally longer to fill than k=50 did; watch
  # `err_buffer/total_samples` plateau before reading anything into an ablation.
  e2e_error_buffer_k: 500
  e2e_buffer_warmup_iter: 20
  e2e_noise_prob: 0.01
  e2e_latent_prob: 0.9
  e2e_y_prob: 0.9
  e2e_clean_prob: 0.5
