# ─────────────────────────────────────────────────────────────────────────────
# E2E-TTT meta-training config for Wan2.2-TI2V-5B.
#
# Run with:
#   accelerate launch examples/wanvideo/model_training/train_e2e_ttt.py \
#       --config examples/wanvideo/model_training/configs/Wan2.2-TI2V-5B-e2e-ttt.yaml
#
# The 5B DiT is sharded across 3 safetensors files — passed as a NESTED list so they
# load as a single DiT ModelConfig (same as the inference script's sorted(glob(...))).
# 5B is heavier than 1.3B; enable use_gradient_checkpointing if you hit OOM (it is auto-
# disabled only on the differentiable meta path, so it still helps the rest of the graph).
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  dataset_base_path: /work/nlp/hzhao/datasets/e2e-ttt-video
  dataset_metadata_path: /work/nlp/hzhao/datasets/e2e-ttt-video/train_diffsynth_merged.csv
  dataset_repeat: 1
  height: 720 # [352, 720]
  width: 1280 # [512, 1280]
  num_frames: 196
  frame_rate: 16

model:
  model_paths:
    - - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/google/umt5-xxl

train:
  learning_rate: 1.0e-5
  num_epochs: 1
  output_path: ./models/train/Wan2.2-TI2V-5B_e2e_ttt_fomaml
  remove_prefix_in_ckpt: pipe.dit.
  use_gradient_checkpointing: true

lora:
  lora_base_model: dit
  lora_target_modules: [q, k, v, o, ffn.0, ffn.2]
  lora_rank: 32

# Weights & Biases monitoring. Offline by default (safe on air-gapped compute
# nodes) — runs land in <output_path>/wandb_log; `export WANDB_MODE=online` to
# stream live, or `disabled` to turn off without editing this file. The run name
# defaults to the output_path basename. All metrics are logged under the wandb
# "train" group each step: train/meta_loss, train/memorize_loss,
# train/num_pred_pairs, train/num_mem_steps, train/inner_lr, and train/meta_lr
# (the live outer-loop LR).
logger:
  enable_wandb_log: true
  wandb_project: E2E-TTT

e2e_ttt:
  e2e_num_chunks: 4 # [2, 4, 6, 8]
  e2e_frames_per_chunk: 49 # [13, 25, 37, 49]
  e2e_num_gradient_steps: 1 
  e2e_num_mc_samples: 1
  e2e_inner_lr: 1.0e-4
  e2e_max_inner_grad_norm: 1.0
  e2e_inner_optimizer: sgd
  e2e_truncate_steps: []
  e2e_sigma_shift: 5.0
  e2e_first_order: true         # FOMAML: drop the Hessian term
