# ─────────────────────────────────────────────────────────────────────────────
# REPTILE variant of Wan2.1-Fun-V1.1-1.3B-InP-e2e-ttt-smoke.yaml.
#
# Identical to the smoke config except for `e2e_algorithm: reptile`. Reptile adapts
# the LoRA scratchpad phi_0 -> phi_K with plain (non-differentiable) SGD on the
# memorize chunks (chunks 0..N-2), then moves phi_0 toward the adapted weights via the
# pseudo-gradient (phi_0 - phi_K). There is NO predict term and NO second-order graph:
# every inner step is a single first-order backward, so fused flash/sage attention is
# allowed (no math-SDPA pin) and `e2e_truncate_steps` is ignored. Memory footprint is
# the lowest of the three algorithms.
#
# Logged `train/meta_loss` is the mean MEMORIZE loss (Reptile has no predict term);
# `train/num_pred_pairs` is therefore 0. The surrogate scalar the runner actually
# back-propagates is logged for debugging as `train/reptile_surrogate` only if you add
# it -- by default just watch train/memorize_loss and lora/inner_adapt_ratio.
#   * e2e_num_chunks: 2          → memorize chunk 0 only (shallowest adaptation)
#   * e2e_num_mc_samples: 1      → one (t, noise) draw per loss eval
#   * dataset_repeat: 1, num_epochs: 1 → ~8 steps total over the 8-clip bdd100k set
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  dataset_base_path: /work/nlp/hzhao/datasets/e2e-ttt-video
  dataset_metadata_path: /work/nlp/hzhao/datasets/e2e-ttt-video/ttt_imagine_10k.csv
  dataset_repeat: 1
  # Reptile's single-backward, no-second-order-graph path uses the least memory of the
  # three variants, so there is ample headroom here; bump the resolution back up freely.
  height: 352
  width: 512
  num_frames: 164              # first 164 frames are used (4 chunks * 41)
  frame_rate: 16

model:
  model_paths:
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/diffusion_pytorch_model.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/Wan2.1_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/google/umt5-xxl

train:
  learning_rate: 5.0e-3
  num_epochs: 1
  output_path: ./models/train/Wan2.1-Fun-V1.1-1.3B-InP_e2e_ttt_reptile_imagine_10k
  remove_prefix_in_ckpt: pipe.dit.
  # Gradient checkpointing is carried through the inner-step recompute by the override
  # path (see _override_checkpointed_blocks); safe with Reptile's single first-order
  # backward. Without it the memorize forwards retain all 30 layers' activations.
  use_gradient_checkpointing: true

lora:
  lora_base_model: dit
  lora_target_modules: [q, k, v, o, ffn.0, ffn.2]
  lora_rank: 32

# Weights & Biases monitoring. Offline by default; `export WANDB_MODE=online` to stream.
# Metrics under the "train" group each step: train/meta_loss (= memorize loss for
# Reptile), train/memorize_loss, train/num_pred_pairs (0), train/num_mem_steps,
# train/inner_lr, train/meta_lr (live outer LR), and lora/inner_adapt_{norm,ratio}.
logger:
  enable_wandb_log: true
  wandb_project: E2E-TTT

e2e_ttt:
  e2e_num_chunks: 4
  e2e_frames_per_chunk: 41
  e2e_num_gradient_steps: 1
  e2e_num_mc_samples: 1
  e2e_inner_lr: 1.0e-4
  e2e_max_inner_grad_norm: 1.0
  e2e_inner_optimizer: sgd
  e2e_truncate_steps: []
  e2e_sigma_shift: 5.0
  e2e_algorithm: reptile        # Reptile: SGD adaptation, then move phi_0 toward phi_K
