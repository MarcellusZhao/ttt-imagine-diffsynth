# ─────────────────────────────────────────────────────────────────────────────
# FOMAML E2E-TTT meta-training for Wan2.1-Fun-V1.1-1.3B-InP, i2v anchor route.
#
# FOMAML drops the Hessian term from the meta-gradient: `create_graph=False` frees each
# memorize graph as soon as its grad is taken, fused flash/sage attention is allowed (no
# math-SDPA pin), and `e2e_truncate_steps` is ignored.
#
# MEMORY: FOMAML removes the double-backward cost, but NOT the chunk-count scaling. The
# meta-loss accumulates one PREDICT graph per memorize→predict pair and holds all of them
# until the single outer .backward(), so peak memory still grows ~linearly in chunk count.
# With gradient checkpointing at 480x832 / fpc=45 (12 latents → ~18.7k tokens) each retained
# predict graph is roughly 30 layers x 18.7k x 1536 x 2B ≈ 1.7 GB, so:
#     e2e_num_chunks: 4  → 3 pairs ≈ 5.2 GB of retained graph
#     e2e_num_chunks: 8  → 7 pairs ≈ 12 GB
#     adaptive (0)       → up to 7 chunks on THIS dataset ≈ 10 GB (short_3k is length-filtered
#                          to 160-320 frames; an unfiltered list reaching 23 chunks would be
#                          ~38 GB — the OOM risk)
# So `e2e_num_chunks` is the memory ceiling to turn first, before resolution or fpc. To run
# the FULL video instead of a fixed 4-chunk window, set `e2e_num_chunks: 0` (adaptive) and
# `num_frames: 0` (load each clip's true length) — and expect the peak to track the longest
# clip in the batch, which is what `length_grouped_batching` below exists to tame.
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  dataset_base_path: /work/nlp/hzhao/datasets/e2e-ttt-video/ultravideo_long_960/curated_videos
  dataset_metadata_path: /home/hzhao/ttt-imagine-diffsynth/datasets/ultravideo_long/ultravideo_long_filtered_short_3k_len.csv
  dataset_repeat: 1
  # 480x832 is this checkpoint's native resolution (and what lora/Wan2.1-Fun-V1.1-1.3B-InP.sh
  # trains at). On the Wan2.1 VAE (8x) that is 60x104 latents → 30x52 = 1560 DiT tokens per
  # latent frame, so a 45-frame chunk (12 latents) is ~18.7k tokens — ~2.4x the tokens and
  # ~5.8x the O(seq²) attention of the old 352x512. FOMAML's single backward fits; exact
  # second-order MAML at this resolution needs a shorter e2e_frames_per_chunk.
  height: 480
  width: 832
  num_frames: 0              # 0 = each clip's true length; the chunker takes as many as fit
  # The clips on disk are already 16fps (resampled offline — `rsfps16` in output_path), but
  # that was an UNENFORCED precondition living in a preprocessing step. Making it explicit
  # matters more here than anywhere else: the m=5 motion window carries velocity, so a clip
  # at the wrong fps poisons exactly the cue the anchor exists to provide. It is also
  # strictly cheaper — the frame count then comes from the container duration instead of a
  # full ffmpeg demux pass. NOTE `frame_rate` is ONLY read when `fix_frame_rate` is set.
  fix_frame_rate: true
  frame_rate: 16
  # Video decode is 5-11 s/clip and runs on the training loop's critical path at the default
  # of 0 workers. 2 workers drops the measured per-step stall from ~6.5 s to ~1.0 s.
  dataset_num_workers: 2
  # Group each optimizer step's clips by length instead of shuffling globally, so ranks stop
  # idling at the all-reduce behind the step's longest clip. Free to enable here: the
  # metadata file above is the `_len` variant, i.e. the same 3000 rows plus a `num_frames`
  # column (generated by datasets/ultravideo_long/add_length_column.py, inert to
  # UnifiedDataset since operators only run on data_file_keys).
  #
  # This matters because `num_frames: 0` + `e2e_num_chunks: 0` make step cost proportional to
  # each clip's CHUNK count, and under DDP a step costs as much as its longest clip. At
  # fpc=41 with the i2v route's overlap m=5 (stride 36) the short_3k clips span 4..8 chunks
  # (median 5, mean 5.5). Computed on this exact CSV, `sum_steps max_rank(n) / ideal`:
  #       ranks x accum:      2       4       8
  #       random order:    1.13x   1.25x   1.34x
  #       grouped:         1.004x  1.006x  1.006x   (93-96% of steps perfectly uniform)
  # Read those as a BOUND on the imbalance, not a wall-clock prediction -- the model treats
  # step cost as purely proportional to chunk count, and the fixed per-step cost (which no
  # reordering touches) was 82% of a step on the measured 4xH100 5B run. short_3k is also
  # length-FILTERED (160-320 frames); the unfiltered 16k list spans 3..23 chunks, where the
  # imbalance term is far larger. Kept on regardless: pure reordering, costs nothing, and it
  # cannot change what is trained -- LoadVideo still measures the real length, so the column
  # is only a ranking hint.
  length_grouped_batching: true
  length_column: num_frames
  # Sort window = group_size * mult, where group_size = num_processes * gradient_accumulation_
  # steps. Bounded so the epoch keeps sampling randomness; the resulting groups are then
  # shuffled globally so clip length never correlates with training time (LR warmup/cosine,
  # ErrorRecycler warmup). NOTE the knob runs opposite to its --help string: 1 degenerates to
  # a plain random shuffle, and only mult >= len(dataset)/group_size approaches a global sort.
  length_group_megabatch_mult: 50

model:
  model_paths:
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/diffusion_pytorch_model.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/Wan2.1_VAE.pth
    # REQUIRED for the i2v anchor route. This checkpoint has require_clip_embedding, so
    # without the image encoder the DiT would run with no image tokens prepended to the
    # cross-attention context — off-distribution on every chunk, and silently so.
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.1-Fun-V1.1-1.3B-InP/google/umt5-xxl

train:
  learning_rate: 1.0e-5
  # Matched to the Wan2.2-TI2V-5B k3 arms so the two model families differ in architecture and
  # anchor route, not in outer-loop optimisation. The parser default is `constant`, so leaving
  # these unset is itself a choice. At ~3000 steps the 30-step warmup is the first 1% (the 5B
  # 720p arm ran 1966 steps, so 1.5% there) and the cosine then decays to 1e-6.
  #
  # Two other warmups sit in the same window and are NOT this one: e2e_buffer_warmup_iter (50)
  # gates when the ErrorRecycler starts injecting, and the meta-learned inner LR is separate
  # again. Note this is also why length_grouped_batching shuffles its groups — with a real LR
  # schedule, any correlation between clip length and training *time* would bias the warmup and
  # the decay tail toward one end of the length distribution.
  lr_scheduler: cosine_warmup
  lr_warmup_steps: 30
  lr_min_ratio: 0.1
  num_epochs: 1
  # REQUIRED, not a nicety. With save_steps unset the runner saves only via on_epoch_end, i.e.
  # exactly once — and at num_epochs: 1 that is a single write at the very end. The 5B arm has
  # already paid for this: job 3998495 died at step 1557/1966 (79%) after 31h of 8xH100 and left
  # ZERO checkpoints. This arm is a 1-GPU sbatch with a 3-day wall clock over ~3000 steps
  # (3000 clips x dataset_repeat 1, batch 1, and at fpc=45 no clip is short enough to be
  # skipped), so it writes at steps 500/1000/1500/2000/2500 plus the final one — 6 checkpoints.
  # Setting this also switches the final write from `epoch-0.safetensors` to
  # `step-<N>.safetensors` (ModelLogger.on_training_end), which still fires.
  #
  # Disk: LoRA-only, but rank 128 on a 1536-dim / 30-layer DiT is ~175M trainable params
  # (30 x [8 attn Linear(1536,1536) + ffn.0/ffn.2] x 128 x (in+out)), i.e. ~350 MB per write in
  # bf16, ~2 GB for the run. Note that is 13% of the 1.3B base — rank 128 is proportionally a
  # much larger adapter here than on the 5B (dim 3072), where the same rank was chosen.
  save_steps: 500
  # Same location and naming convention as the Wan2.2-TI2V-5B k3 arms, so checkpoints from both
  # model families sit together and the settings a phi_0 is only valid under are readable off
  # the path. Slots, in the 5B order: model _ algo _ anchor _ resolution _ fpc _ rank _
  # deviations _ antidrift _ data-prep _ sampler _ dataset. Here the anchor slot is `i2v_m5`
  # (the route + motion window) where the 5B arms carry `k3`, and `reffirst` records the one
  # place this config departs from SVI (--e2e_ref_frame_source, see below).
  output_path: /work/nlp/hzhao/checkpoints/e2e-ttt/Wan2.1-Fun-V1.1-1.3B-InP_e2e_ttt_fomaml_i2v_m5_480p_fpc45_r128_reffirst_antidrift_svi_uvl_fs_rsfps16_len_grouped_3k
  remove_prefix_in_ckpt: pipe.dit.
  # Activation checkpointing is carried through the recompute by the override path
  # (see _override_checkpointed_blocks). Without it the memorize + predict forwards
  # retain all 30 layers' activations and OOM ~90 GB on one H100.
  use_gradient_checkpointing: true

lora:
  lora_base_model: dit
  # The standard Wan LoRA recipe -- SVI's default (`train_svi.py`) and upstream DiffSynth's own
  # Wan2.1-Fun-V1.1-1.3B-InP.sh / Wan2.1-I2V-14B-480P.sh use this exact list.
  #
  # It does NOT mean "every attention projection". PEFT matches a list of target_modules by
  # SUFFIX (`name.endswith(".q")`), and a `has_image_input` DiT carries two extra projections
  # that no entry matches -- verified against the installed peft:
  #     matched: self_attn.{q,k,v,o}, cross_attn.{q,k,v,o}, ffn.0, ffn.2
  #     NOT:     cross_attn.k_img, cross_attn.v_img, img_emb.*, patch_embedding
  # So the scratchpad cannot re-project the 257 CLIP image tokens into K/V. It is a smaller gap
  # than it sounds: CrossAttention computes ONE `q` for both paths and sums them before `o`
  # (`x = attn(q,k,v) + attn(q,k_img,v_img); return o(x)`), and both `q` and `o` ARE adapted --
  # the scratchpad still controls what is asked of the image tokens and what is done with the
  # answer, just not how those tokens present themselves. Note also that `patch_embedding` is
  # unadapted, so the scratchpad never re-encodes the conditioning input on EITHER channel
  # (`y` included); it works on the trunk representation. Recorded because the exclusion falls
  # out of a name-matching rule rather than a decision. Adding `k_img, v_img` is a cheap
  # experiment, but phi_0 would not be interchangeable -- do not change it alongside anything
  # else.
  lora_target_modules: [q, k, v, o, ffn.0, ffn.2]
  # Must match `--lora_rank` on the sampling side, or the checkpoint will not load into the
  # adapter the inference script builds. 128 matches what the Wan2.2-TI2V-5B configs use.
  lora_rank: 128

# Weights & Biases monitoring. Offline by default (safe on air-gapped compute
# nodes) — runs land in <output_path>/wandb_log; `export WANDB_MODE=online` to
# stream live, or `disabled` to turn off without editing this file. The run name
# defaults to the output_path basename. All metrics are logged under the wandb
# "train" group each step: train/meta_loss, train/memorize_loss,
# train/num_pred_pairs, train/num_mem_steps, train/inner_lr, and train/meta_lr
# (the live outer-loop LR).
logger:
  enable_wandb_log: true
  wandb_project: E2E-TTT

e2e_ttt:
  # The memory ceiling for FOMAML — see the header. 0 = adaptive (one chunk per
  # `frames_per_chunk` of each clip's real length), i.e. the full video.
  e2e_num_chunks: 0 # [0 = adaptive, 2, 4, 6, 8]
  # 45 = 4n+1 -> 12 latents, ALL supervised (the i2v route pins nothing). Chosen so that
  # stride = fpc - m = 45 - 5 = 40 MATCHES the Wan2.2-TI2V-5B k3 arms (fpc=53, overlap 13,
  # stride 40), i.e. both model families emit 40 new frames per chunk and a fixed number of
  # chunks yields the same video length -- length-sensitive metrics (VBench) then compare
  # across families without a geometry confound.
  # Cost of 45 over 41 on short_3k (measured on the metadata): chunks 5.50 -> 4.90 mean, so
  # memorize->predict pairs drop 4.50 -> 3.90 (-13%), and tokens per forward rise 17.2k ->
  # 18.7k (+9%). No clip becomes unusable (min 3 chunks, none skipped). If pair density
  # matters more than cross-family comparability, go back to 41 and accept stride 36.
  e2e_frames_per_chunk: 45 # [13, 25, 37, 41, 45, 49]
  e2e_num_gradient_steps: 2
  e2e_num_mc_samples: 1
  e2e_inner_lr: 1.0e-5
  e2e_max_inner_grad_norm: 1.0
  # Must match `--optimizer` on the sampling side. The inference driver's default is also
  # `sgd`; if you change one, change both, or the test-time update becomes a different rule
  # from the meta-trained one.
  e2e_inner_optimizer: adamw
  e2e_truncate_steps: []        # ignored under FOMAML (no second-order graph to truncate)
  e2e_sigma_shift: 5.0
  e2e_algorithm: fomaml         # first-order MAML: same predict objective, Hessian dropped

  # ── i2v anchor route (this DiT has has_image_input + require_vae_embedding, so the route
  # selector picks it automatically; see `self.anchor_route` in train_e2e_ttt.py). Settings
  # follow Stable-Video-Infinity, which drives the 14B sibling of this checkpoint the same way.
  e2e_condition_on_last_frame: true
  # PIXEL frames, not latent frames. m=5 → 2 latent frames of real motion content, which is
  # SVI-Film's / SVI 2.0's setting; m=1 is stock single-frame I2V (SVI-Shot/Talk/Dance).
  # Also the chunk overlap, hence the stride: each chunk contributes 45 - 5 = 40 new frames.
  # Do NOT reach for m=1 to widen the stride -- motion_latent_frames(1) = 1, and a single
  # anchor latent is motion-unidentifiable, which is the exact cue m=5 exists to carry.
  # Change fpc instead.
  e2e_num_motion_frames: 5
  # -1 = fill every non-motion slot of `y` with the reference frame ("padding for ID
  # consistency"). SVI 2.0 uses -1 with m=5; SVI-Film uses 0 (plain zeros).
  e2e_ref_pad_num: -1
  # WHICH frame is that reference. `first` matches inference exactly: the generator captures
  # the video's own first frame after chunk 0 (e2e_ttt.py, `sink_image = frames[0]`) and hands
  # the same one to every later chunk -- or uses --input_image, which seeds that same frame.
  # SVI instead draws a random frame per clip, because ITS reference is a user-supplied still
  # that need not belong to the video at all. We don't need that robustness, and it biases the
  # wrong way: a random frame is on average more contemporaneous with the chunk being predicted
  # than frame 0, and is a FUTURE frame about half the time, so phi_0 would be meta-learned
  # under a strictly more informative reference than it ever gets at test time. The fused route
  # has always used the first frame on both sides; this makes i2v agree. Set `random` to
  # reproduce SVI. NOTE phi_0 checkpoints are not interchangeable across the two.
  e2e_ref_frame_source: first
  # OFF (1.0 = always use a real motion window). SVI's default is 0.9, i.e. 10% of chunks are
  # conditioned on their own first frame repeated m times instead — the regime chunk 0 is in at
  # inference when a still start image is supplied. We do NOT sample with --input_image, so that
  # regime never occurs: chunk 0 gets null conditioning (zero mask, zero latents) because
  # `motion_frames` is None, not a repeated still.
  #
  # Even with a start image it lands in the wrong place here, which SVI's single-chunk training
  # does not expose: chunk 0 is never a predict target (`for k in range(len(chunks)-1)` predicts
  # k+1, and conditions[] is built only for k>=1), so the draw can only ever hit chunks 1..n-1 —
  # exactly the ones that DO have a real window at inference — and pairs it with an already-
  # adapted phi_K, while inference needs phi_0. Training (phi_K, still window) to serve
  # (phi_0, still window) is at best an indirect proxy.
  #
  # Cost of leaving it on: mean 3.9 predict pairs/clip x 10% ~= 1170 pairs per 3000-clip epoch
  # spent on a regime that is never sampled. Restore 0.9 if this arm ever samples with
  # --input_image, where chunk 0's quality compounds (it is memorized into the scratchpad and
  # its tail becomes chunk 1's anchor).
  e2e_p_motion_threshold: 1.0

  # ── Error recycling. The probabilities are SVI-Film's, which is also what the TI2V-5B k3
  # configs already converged on (noise_prob near zero matches our own finding that noise
  # injection is the one mode leaking into the target — harvest skips those draws).
  e2e_use_error_recycling: true
  e2e_num_grids: 50
  # ONE arena per NODE instead of one buffer per rank. `$TMPDIR` is /tmp/<jobid> here, i.e.
  # real node-local NVMe, created and torn down per job; on a multi-node run each node gets
  # its own physical directory behind the same path string, which is exactly the per-node
  # arena we want. `${VAR}` and `~` are expanded; an UNSET variable raises at startup rather
  # than creating a literal "${TMPDIR}" dir on shared storage.
  #
  # It MUST be node-local. The arena filename keys on SLURM_JOB_ID and the buffer geometry,
  # NOT on the node, so a path on shared storage would make both nodes map the SAME file --
  # and the write partitions are cut by LOCAL rank, so each node's local rank 0 would own the
  # same slot range. That breaks the single-writer assumption the seqlock rests on. Not
  # tmpfs either (/dev/shm pages are unreclaimable and a SIGKILL leaks them to the next job).
  #
  # If the directory is unusable the code warns and falls back to per-rank buffers -- which at
  # k=500 is ~70 GB/rank and dies on any launcher here. The warning prints in the first
  # seconds of the log; do not ignore it.
  e2e_shared_buffer_dir: ${TMPDIR}/e2e_ttt_errbuf
  # 500 = SVI's own buffer size, matching both TI2V-5B k3 arms, and affordable only because
  # the arena is shared. Buffers are HOST RAM (`_add_error_to_buffer` does `.cpu()`) and are
  # sized per chunk shape. At 480x832 / fpc=45 the chunk latent is 16 x 12 x 60 x 104 x 2B =
  # 2.40 MB and the m=5 motion window's anchor slice (2 latent frames) 0.40 MB, so one unit
  # of k costs 50 grids x 2.80 MB = 0.140 GB:
  #
  #        k     shared/node     per-rank x4
  #       96        13.4 GB         53.7 GB     <- previous setting
  #      500        69.9 GB        279.6 GB     <- this config
  #
  # NOTE this is the POST-MERGE accounting: `noise` and `y` used to be two separate
  # full-chunk buffers and are now one `residual_buffer` of (d, sigma) pairs, so the
  # full-chunk cost halved. The anchor buffer stays separate (different population, different
  # read path) and is the second term above.
  #
  # ── WHICH LAUNCHER ─────────────────────────────────────────────────────────────────────
  # k=500 is sized for the MULTI-NODE launcher (--mem=368G, 4 ranks/node): 69.9 GB of arena
  # plus ~68 GB non-buffer (4 x ~11.4 GB umt5-xxl shuttled to host RAM, ~6 GB of in-flight
  # decoded frames, ~4 GB/rank overhead) is ~138 GB, 37% of the limit; k_max is ~2100.
  # The SINGLE-GPU launcher (-fomaml.sbatch) requests --mem=88G, where the arena alone is
  # 69.9 GB and non-buffer is ~17 GB (one umt5-xxl copy, not four): ~87 GB of 88, i.e. 99%
  # with no margin, and that non-buffer term is an estimate -- the 5B 720p run was
  # OOM-killed at 91% of its limit. Raise that sbatch to 32 CPUs / 184G before using this
  # config with it (the partition's MaxMemPerCPU=5900 caps --mem at cpus x 5.9 GB, so
  # 16 CPUs cannot go past ~92G), or drop k for single-GPU runs.
  #
  # NOTE what this does and does not buy: `err_buffer/miss_rate` was already 0 at k=96, so
  # everything past saturation buys DIVERSITY, not coverage. The write rate per rank is also
  # unchanged -- each of 4 ranks owns 125 of the 500 slots per grid -- so the pool takes
  # proportionally longer to fill; watch `err_buffer/total_samples` plateau, and
  # `err_buffer/shared` to confirm the arena engaged at all, before reading an ablation.
  e2e_error_buffer_k: 500
  e2e_buffer_warmup_iter: 50
  e2e_noise_prob: 0.01
  e2e_latent_prob: 0.9
  e2e_y_prob: 0.9
  e2e_clean_prob: 0.5
  e2e_anchor_sample_from_all_grids: true
