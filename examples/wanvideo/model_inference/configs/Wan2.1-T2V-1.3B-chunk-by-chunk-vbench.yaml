# ─────────────────────────────────────────────────────────────────────────────
# Chunk-by-chunk VBench inference config for Wan2.1-T2V-1.3B.
#
# Run with:
#   python examples/wanvideo/model_inference/Wan2.1-T2V-1.3B-chunk-by-chunk-vbench.py \
#       --config examples/wanvideo/model_inference/configs/Wan2.1-T2V-1.3B-chunk-by-chunk-vbench.yaml
#
# Sections are for readability only — just the leaf keys matter, and they must
# match the script's argparse dest names. CLI flags override the YAML, so you can
# pass --dimension / --start_index / --end_index / --skip_existing per process
# when sharding. Each VBench clip is num_chunks * frames_per_chunk frames long.
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_paths:
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-T2V-1.3B/diffusion_pytorch_model.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-T2V-1.3B/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.1-T2V-1.3B/google/umt5-xxl
  device: cuda

vbench:
  vbench_root: /home/hzhao/VBench
  dimension: all                 # or a single dimension, e.g. object_class / temporal_flickering
  num_videos_per_prompt: 1       # null -> 5, auto-25 when dimension == temporal_flickering
  base_seed: 0                   # clip i uses chunk seeds base_seed + i*num_chunks + k

chunking:
  num_chunks: 4                  # contiguous sub-clips concatenated per VBench clip
  frames_per_chunk: 41           # 4n+1 for the Wan temporal VAE
  condition_on_last_chunk: true  # seed each chunk on the previous chunk via the V2V path
  denoising_strength: 0.7        # V2V renoise for conditioned chunks (1.0 = pure T2V)

generation:
  height: 352
  width: 512
  num_inference_steps: 50
  cfg_scale: 5.0
  sigma_shift: 5.0
  negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

output:
  save_path: ./results/vbench/Wan2.1-T2V-1.3B-chunk-by-chunk
  fps: 16
  quality: 5
