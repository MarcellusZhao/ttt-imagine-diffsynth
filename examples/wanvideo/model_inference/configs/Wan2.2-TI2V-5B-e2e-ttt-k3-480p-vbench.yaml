# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT B (inference) — k=3 wide anchor at 480p, chunk length matched to training.
#
# Pairs with model_training/configs/Wan2.2-TI2V-5B-e2e-ttt-fomaml-k3-480p.yaml.
# Point `lora` at that run's phi_0.
#
# num_anchor_latent_frames MUST equal the checkpoint's
# e2e_num_anchor_latent_frames. k sets both how many leading latents are pinned and
# how many decoded frames each chunk hands forward, so a mismatch conditions the DiT
# differently from meta-training and phi_0 will be operating off-distribution. Same
# for condition_on_sink_frame vs the checkpoint's e2e_condition_on_sink_frame.
#
# Frame budget at frames_per_chunk=53, k=3 + sink:
#   53 frames = 14 latents; 4 pinned (sink at latent 0, anchor block at 1..3);
#   13 pinned pixel frames dropped at each boundary -> 40 NEW frames per chunk.
#   Pinned overhead is 13/53 = 25%.
# This is the SAME chunk length the phi_0 was meta-trained at (e2e_frames_per_chunk:
# 53), so test-time chunks are exactly the shape the inner loop saw — no train/test
# gap in either resolution or chunk length for this arm.
#
# Cost: tokens per forward are (480/32)*(832/32)*14 = 5460 vs 880*11 = 9680 for the
# 704x1280 fpc=41 k=1 baseline, i.e. ~56% — attention is quadratic in that, so the
# forward is cheaper still. 14 latents also sits inside the base model's native
# 121-frame / 31-latent extent, so no RoPE extrapolation.
#
# LENGTH: 53 + 40*23 = 973 frames (~61s @16fps). The k3-720p arm
# (Wan2.2-TI2V-5B-e2e-ttt-k3-720p-vbench.yaml) and the no-adaptation ablation
# (Wan2.2-TI2V-5B-chunk-by-chunk-anchored-vbench.yaml) are both at the same fpc=53 /
# 24 chunks, so all three k=3 arms are length-matched at 973 and VBench's
# length-sensitivity drops out of the comparison.
#
# The k=1 arm (Wan2.2-TI2V-5B-e2e-ttt-vbench.yaml) is also at fpc=53, but k=1 + sink
# pins 2 latents = 5 pixel frames rather than 4 = 13, so it emits 48 new frames per
# chunk and 1157 in total. k is exactly what sets the per-chunk overhead, so equal
# chunk length and equal chunk count cannot also give equal total length against k=1;
# reading k=3 against k=1 carries a ~16% length difference either way.
#
# THE RISK TO WATCH: the anchor gives 12 frames of context and constrains 40 generated
# frames (30%). The anchor pins the first ~12 frames hard and the last ones barely at
# all, so the failure mode that replaces boundary reversal is low-dynamics /
# copy-forward continuation and mid-chunk motion drifting from what the previous chunk
# established. Read dynamic_degree alongside subject_consistency — subject consistency
# alone will happily reward a static video.
#
# Run with:
#   python examples/wanvideo/model_inference/vbench/Wan2.2-TI2V-5B-e2e-ttt-vbench.py \
#       --config examples/wanvideo/model_inference/configs/Wan2.2-TI2V-5B-e2e-ttt-k3-480p-vbench.yaml
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_paths:
    - - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    - /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  tokenizer_path: /work/nlp/hzhao/checkpoints/wan/Wan2.2-TI2V-5B/google/umt5-xxl
  device: cuda

lora:
  # phi_0 from Wan2.2-TI2V-5B-e2e-ttt-fomaml-k3-480p.yaml (its `output_path`). Set this
  # before running — a non-existent path silently falls back to a zero-init identity
  # adapter, which still adapts at test time but is NOT the trained phi_0.
  # lora: /work/nlp/hzhao/checkpoints/e2e-ttt/Wan2.2-TI2V-5B_e2e_ttt_fomaml_k3_480p_fpc53_antidrift_uvl_fs_rsfps16_len_grouped_16k/epoch-0.safetensors
  algorithm: fomaml
  # Must match the training run's lora_rank.
  lora_rank: 128
  target_modules: [q, k, v, o, ffn.0, ffn.2]

inner_loop:
  # Match the training run's inner loop — phi_0 was meta-learned for exactly this
  # adaptation procedure, so changing steps/LR/optimizer here changes what phi_0 is
  # optimal for. Mirrors e2e_inner_optimizer / e2e_num_gradient_steps / e2e_inner_lr /
  # e2e_max_inner_grad_norm in the training config.
  optimizer: adamw
  num_gradient_steps: 2
  num_mc_samples: 1
  inner_lr_init: 1.0e-5
  max_inner_grad_norm: 1.0

vbench:
  vbench_root: /home/hzhao/VBench
  dimension: all
  num_videos_per_prompt: 1
  base_seed: 0

chunking:
  num_chunks: 24
  # 53 = 4n+1, and the same chunk length the phi_0 was meta-trained at.
  frames_per_chunk: 53
  # k. MUST equal the checkpoint's e2e_num_anchor_latent_frames.
  num_anchor_latent_frames: 3
  ttt_steps_per_chunk: 1
  condition_on_last_frame: true
  drop_boundary_frame: true      # trims the 13 pinned pixel frames at each boundary
  # First-frame "sink": a second, non-sliding anchor pinned at latent 0 in every
  # follow-up chunk. Matches e2e_condition_on_sink_frame in the training config; set
  # false (or pass --no_condition_on_sink_frame) for a phi_0 trained without it.
  condition_on_sink_frame: true

generation:
  height: 480
  width: 832
  num_inference_steps: 50
  cfg_scale: 5.0
  sigma_shift: 5.0
  negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

output:
  save_path: ./results/vbench/Wan2.2-TI2V-5B-e2e-ttt-fomaml-k3-480p-fpc53
  fps: 16
  quality: 5
